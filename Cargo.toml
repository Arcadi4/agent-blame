[package]
name = "agent-blame"
version = "0.1.0"
edition = "2024"
description = "The git blame of agents. See who's to blame for this slop code."
license = "Apache-2.0"

[dependencies]
anyhow = "1"
bstr = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ignore = "0.4"
memchr = "2"
owo-colors = { version = "4", features = ["supports-colors"] }
rayon = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
similar = "3"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
zstd = "0.14"

[dev-dependencies]
tempfile = "3"

# Debug info is the most expensive part of an unoptimized build, and a
# backtrace only needs this crate's line tables to name a source line.
# Dependency debug info is never read, so none of it is generated.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true

